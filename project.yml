name: XolarAdmin

options:
  bundleIdPrefix: com.xolar
  deploymentTarget:
    iOS: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  XolarAdmin:
    type: application
    platform: iOS
    sources:
      - path: XolarAdmin
        excludes:
          - Info.plist
          - GoogleService-Info.plist
    resources:
      - XolarAdmin/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xolar.admin
        INFOPLIST_FILE: XolarAdmin/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: XolarAdmin/XolarAdmin.entitlements

schemes:
  XolarAdmin:
    build:
      targets:
        XolarAdmin: all
    run:
      config: Debug
    archive:
      config: Release